version: '3'

dotenv: ['.env.discord']

tasks:
  default:
    desc: 利用できるタスクを表示
    cmds:
      - task --list

  deploy:
    desc: s1 でブランチを切り替え・pull し、設定を反映して各サービスを再起動（BRANCH 指定可）
    vars:
      CURRENT_BRANCH:
        sh: git -C {{.TASKFILE_DIR | shellQuote}} branch --show-current
      DEPLOY_BRANCH: '{{.BRANCH | default .CURRENT_BRANCH}}'
    requires:
      vars: [DEPLOY_BRANCH]
    cmds:
      - >-
        ssh s1
        {{printf "cd /home/isucon || exit 1; if test -n \"$(git status --porcelain)\"; then echo 'サーバーに未コミットの変更があるため中止します' >&2; exit 1; fi; git fetch origin && git switch -- %s && git pull --ff-only origin %s" (.DEPLOY_BRANCH | shellQuote) (.DEPLOY_BRANCH | shellQuote) | shellQuote}}
      - >-
        ssh s1 'cd /home/isucon/webapp/nodejs
        && /home/isucon/.x npm ci
        && /home/isucon/.x npm exec -- tsc --noEmit'
      - task: deploy-config
      - >-
        ssh s1 'sudo systemctl restart isuride-node.service'
      - task: wait-ready
      - task: status

  deploy-config:
    desc: s1 の取得済み設定を配置・検査し、MySQL・nginxを再起動
    cmds:
      - |
        ssh s1 '
          set -eu
          cd /home/isucon
          # my.cnf の既存リンクを保つため、リンク先の実体へ配置する。
          sudo -n install -o root -g root -m 0644 \
            common/etc/mysql/my.cnf \
            /etc/mysql/mysql.cnf
          sudo -n install -o root -g root -m 0644 \
            common/etc/mysql/mysql.conf.d/mysqld.cnf \
            /etc/mysql/mysql.conf.d/mysqld.cnf
          sudo -n install -o root -g root -m 0644 \
            common/etc/nginx/nginx.conf \
            /etc/nginx/nginx.conf
          sudo -n install -o root -g root -m 0644 \
            common/etc/nginx/sites-available/isuride.conf \
            /etc/nginx/sites-available/isuride.conf
          sudo -n mysqld --validate-config
          sudo -n nginx -t
          sudo -n systemctl restart mysql
          sudo -n systemctl restart nginx
          systemctl is-active mysql nginx
        '

  restart:
    desc: s1 の Node アプリを再起動
    cmds:
      - ssh s1 'sudo systemctl restart isuride-node.service'
      - task: wait-ready
      - task: status

  wait-ready:
    desc: s1 の Node アプリが HTTP 応答するまで待機
    cmds:
      - |
        ssh s1 'bash -s' <<'BASH'
        set -eu
        for attempt in {1..30}; do
          if ! systemctl is-active --quiet isuride-node.service; then
            echo "Node アプリが稼働していません。task logs で確認してください。" >&2
            exit 1
          fi
          # 認証なしの GET が 401 を返せば、DB接続とHTTP受付が完了している。
          http_status=$(curl --disable --silent --output /dev/null \
            --write-out "%{http_code}" --connect-timeout 1 --max-time 1 \
            http://127.0.0.1:8080/api/app/notification) || http_status=000
          if [ "$http_status" = 401 ]; then
            echo "Node アプリの起動を確認しました（HTTP 401）。"
            exit 0
          fi
          sleep 1
        done
        echo "Node アプリの起動を確認できませんでした（HTTP $http_status）。task logs で確認してください。" >&2
        exit 1
        BASH

  status:
    desc: s1 の Node アプリの稼働状態を表示
    cmds:
      - ssh s1 'systemctl status isuride-node.service --no-pager --full'

  logs:
    desc: s1 の Node アプリのログを追跡（Ctrl+C で終了）
    cmds:
      - ssh s1 'sudo journalctl -u isuride-node.service -n 100 -f --no-pager'

  bench:
    desc: bench サーバーから s1 にベンチマークを実行
    cmds:
      - task: logs:rotate
      - python3 scripts/bench.py

  logs:rotate:
    desc: s1 の計測ログを日時付きで退避して再オープン
    cmds:
      - ssh s1 'bash -s' < '{{.TASKFILE_DIR}}/scripts/rotate-analysis-logs.sh'

  setup:tools:
    desc: s1 に alp と pt-query-digest をインストール
    cmds:
      - ssh s1 'bash -s' < '{{.TASKFILE_DIR}}/scripts/setup-analysis-tools.sh'

  alp:
    desc: nginx のリクエストを合計処理時間順で集計
    cmds:
      - >-
        ssh s1 'sudo alp ltsv --file=/var/log/nginx/access.ltsv
        --sort=sum --reverse
        --filters "!(Uri matches \"^/(assets|images)/\")"
        -m "/api/app/rides/[^/]+,/api/chair/rides/[^/]+,/api/owner/chairs/[^/]+"'

  slowquery:
    desc: MySQL のスロークエリログを集計
    cmds:
      - ssh s1 'sudo pt-query-digest --no-version-check /var/log/mysql/mysql-slow.log'

  alp:discord:
    desc: alp の集計結果を Discord に投稿
    cmds:
      - python3 scripts/report_discord.py alp

  slowquery:discord:
    desc: スロークエリの集計結果を Discord に投稿
    cmds:
      - python3 scripts/report_discord.py slowquery

  metrics:discord:
    desc: nginx・MySQL の集計結果を Discord に投稿
    cmds:
      - task: alp:discord
      - task: slowquery:discord
